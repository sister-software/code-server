<!DOCTYPE html>
<!-- Host page for the local (serverless) VS Code workbench, served by
     WorkbenchServer at /. Adapted from @vscode/test-web's ESM template (MIT):
     the prebuilt web-standalone bundle ships no bootstrap of its own — the
     embedder provides the page and main script. Placeholders are filled
     natively; static assets live under /static (the vscode-web bundle). -->
<html>
	<head>
		<script>
			performance.mark('code/didStartRenderer')
		</script>
		<meta charset="utf-8" />

		<!-- Mobile tweaks -->
		<meta name="mobile-web-app-capable" content="yes" />
		<meta name="apple-mobile-web-app-capable" content="yes" />
		<meta name="apple-mobile-web-app-title" content="Code">
		<link rel="apple-touch-icon" href="/static/code-192.png" />

		<!-- Disable pinch zooming -->
		<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no">

		<!-- Workbench Configuration -->
		<meta id="vscode-workbench-web-configuration" data-settings="{{WORKBENCH_WEB_CONFIGURATION}}">

		<!-- Workbench Icon/Manifest/CSS -->
		<link rel="icon" href="/static/favicon.ico" type="image/x-icon" />
		<link rel="manifest" href="/static/manifest.json">
		<link data-name="vs/workbench/workbench.web.main" rel="stylesheet" href="/static/out/vs/workbench/workbench.web.main.internal.css" />
	</head>

	<body aria-label="">
	</body>

	<!-- Startup (do not modify order of script tags!) -->
	<script>
		globalThis._VSCODE_FILE_ROOT = new URL('/static/out/', window.location.origin).toString();
	</script>
	<script src="/static/out/nls.messages.js"></script>
	<script>
		performance.mark('code/willLoadWorkbenchMain');
	</script>
	<script type="module" src="/boot/main.js"></script>
</html>
