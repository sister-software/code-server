name: CodeServerClient
options:
  bundleIdPrefix: software.sister
  deploymentTarget:
    iOS: "16.4"
  createIntermediateGroups: true
packages:
  FlyingFox:
    url: https://github.com/swhitty/FlyingFox
    from: "0.20.0"
  SwiftNIO:
    url: https://github.com/apple/swift-nio
    from: "2.60.0"
  SwiftNIOSSH:
    url: https://github.com/apple/swift-nio-ssh
    from: "0.9.0"
settings:
  base:
    SWIFT_VERSION: "5.9"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    TARGETED_DEVICE_FAMILY: "1,2"
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: "8NUXP45GK9"
targets:
  CodeServerClient:
    type: application
    platform: iOS
    sources:
      - path: CodeServerClient
        excludes:
          - "Resources/**"
      # Everything under Resources/ is bundled verbatim (bridge.js, the local
      # workbench host page + bootstrap), never compiled.
      - path: CodeServerClient/Resources
        buildPhase: resources
      # Vendored serverless VS Code web bundle + ipad-files extension, served by
      # WorkbenchServer. Folder references (copied verbatim into the bundle);
      # populate via scripts/fetch-vscode-web.sh before generating the project.
      - path: Vendor/vscode-web
        type: folder
        buildPhase: resources
      - path: Vendor/ipad-files-web
        type: folder
        buildPhase: resources
    dependencies:
      - package: FlyingFox
      - package: SwiftNIO
        product: NIOCore
      - package: SwiftNIO
        product: NIOPosix
      - package: SwiftNIOSSH
        product: NIOSSH
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: software.sister.codeserverclient
        PRODUCT_NAME: Code
        INFOPLIST_FILE: CodeServerClient/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        ENABLE_USER_SCRIPT_SANDBOXING: NO
