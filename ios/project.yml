name: CodeServerClient
options:
  bundleIdPrefix: software.sister
  deploymentTarget:
    iOS: "16.4"
  createIntermediateGroups: true
packages:
  FlyingFox:
    url: https://github.com/swhitty/FlyingFox
    from: "0.20.0"
  SwiftNIO:
    url: https://github.com/apple/swift-nio
    from: "2.60.0"
  SwiftNIOSSH:
    url: https://github.com/apple/swift-nio-ssh
    from: "0.9.0"
  ios_system:
    path: Vendor/ios_system
settings:
  base:
    SWIFT_VERSION: "5.9"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    TARGETED_DEVICE_FAMILY: "1,2"
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: "8NUXP45GK9"
# A shared, checked-in scheme so the Xcode Run button has a known-good config
# (Debug build+run) instead of relying on an ephemeral auto-generated one that
# isn't reproducible after `xcodegen generate` rewrites the project.
schemes:
  CodeServerClient:
    build:
      targets:
        CodeServerClient: all
    run:
      config: Debug
    test:
      config: Debug
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
targets:
  CodeServerClient:
    type: application
    platform: iOS
    sources:
      - path: CodeServerClient
        excludes:
          - "Resources/**"
          - "Remote/Ish/**/*.a"  # iSH static libs are linked, not compiled (device + sim/)
      # Everything under Resources/ is bundled verbatim (bridge.js, the local
      # workbench host page + bootstrap), never compiled.
      - path: CodeServerClient/Resources
        buildPhase: resources
      # Vendored serverless VS Code web bundle + ipad-files extension, served by
      # WorkbenchServer. Folder references (copied verbatim into the bundle);
      # populate via scripts/fetch-vscode-web.sh before generating the project.
      - path: Vendor/vscode-web
        type: folder
        buildPhase: resources
      - path: Vendor/ipad-files-web
        type: folder
        buildPhase: resources
      # Alpine i386 fakefs for the iSH emulator (copied to a writable dir on
      # first run). Built by scripts/build-ish.sh.
      - path: Vendor/ish-rootfs
        type: folder
        buildPhase: resources
    # Preflight: the workbench bundle, the builtin extension, the Alpine rootfs,
    # and the iSH libs are all gitignored (built by scripts/). A clean checkout
    # has none of them, so pressing Run would build a white-screening app. Fail
    # the build loudly instead, with the exact commands to fix it.
    preBuildScripts:
      - name: "Preflight: vendored artifacts"
        basedOnDependencyAnalysis: false
        script: |
          cd "$SRCROOT"
          miss=0
          need() { [ -e "$1" ] || { echo "error: missing vendored artifact: $1"; miss=1; }; }
          need Vendor/vscode-web/package.json
          need Vendor/ipad-files-web/package.json
          need Vendor/ish-rootfs/meta.db
          if [ "$PLATFORM_NAME" = "iphonesimulator" ]; then
            need CodeServerClient/Remote/Ish/sim/libish.a
          else
            need CodeServerClient/Remote/Ish/libish.a
          fi
          if [ "$miss" = 1 ]; then
            echo "error: vendored build inputs are missing (they are gitignored)."
            echo "error: run: cd ios && ./scripts/build-vscode-web.sh && ./scripts/build-ish.sh"
            echo "error: (or ./scripts/fetch-vscode-web.sh for the prebuilt workbench), then xcodegen generate."
            exit 1
          fi
    dependencies:
      - package: FlyingFox
      - package: SwiftNIO
        product: NIOCore
      - package: SwiftNIO
        product: NIOPosix
      - package: SwiftNIOSSH
        product: NIOSSH
      - package: ios_system
        product: ios_system
      # iSH core (GPLv3) is linked via -force_load (below); sqlite3 backs fakefs,
      # resolv provides the host DNS servers for the guest.
      - sdk: libsqlite3.tbd
      - sdk: libresolv.tbd
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: software.sister.codeserverclient
        PRODUCT_NAME: Code
        INFOPLIST_FILE: CodeServerClient/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        SWIFT_OBJC_BRIDGING_HEADER: CodeServerClient/ios_system-Bridging-Header.h
        SWIFT_TREAT_WARNINGS_AS_ERRORS: NO
        GCC_C_LANGUAGE_STANDARD: gnu11
        # App icon lives in Assets.xcassets/AppIcon.appiconset (single 1024 px,
        # no alpha — iOS down-samples the rest).
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # iSH/ios-linuxkit headers select the guest backend + engine via these
        # macros (mirrors the meson add_project_arguments). GUEST_ARM64 picks the
        # AArch64 cpu/state headers; without it emu/cpu.h #errors out.
        GCC_PREPROCESSOR_DEFINITIONS:
          - "$(inherited)"
          - "GUEST_ARM64=1"
          - "ENGINE_ASBESTOS=1"
          - "LOG_HANDLER_DPRINTF=1"
        HEADER_SEARCH_PATHS:
          - "$(inherited)"
          - "$(SRCROOT)/Vendor/ish-arm64"
          - "$(SRCROOT)/Vendor/ish-arm64/build-ios"
        # iSH archives have circular inter-dependencies; force-load so the
        # linker resolves across them. The libs are platform-specific Mach-O
        # (iphoneos vs iphonesimulator), so pick the matching set per SDK — the
        # device set in Remote/Ish/, the simulator set in Remote/Ish/sim/. Both
        # are arm64 (Apple Silicon sim); build-ish.sh produces both.
        OTHER_LDFLAGS:
          - "$(inherited)"
        OTHER_LDFLAGS[sdk=iphoneos*]:
          - "$(inherited)"
          - "-force_load"
          - "$(SRCROOT)/CodeServerClient/Remote/Ish/libish.a"
          - "-force_load"
          - "$(SRCROOT)/CodeServerClient/Remote/Ish/libish_emu.a"
          - "-force_load"
          - "$(SRCROOT)/CodeServerClient/Remote/Ish/libfakefs.a"
        OTHER_LDFLAGS[sdk=iphonesimulator*]:
          - "$(inherited)"
          - "-force_load"
          - "$(SRCROOT)/CodeServerClient/Remote/Ish/sim/libish.a"
          - "-force_load"
          - "$(SRCROOT)/CodeServerClient/Remote/Ish/sim/libish_emu.a"
          - "-force_load"
          - "$(SRCROOT)/CodeServerClient/Remote/Ish/sim/libfakefs.a"
